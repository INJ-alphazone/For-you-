<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I love cats 🐱</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: #686a67;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #686a67;
    }
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.7s ease;
      pointer-events: none;
    }
    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }
    .scene img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    .text {
      position: absolute;
      top: 11%;
      left: 0; right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      text-shadow: 0 2px 0 #fff, 0 0 18px rgba(255,255,255,0.45);
      letter-spacing: -0.5px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .scene.active .text {
      opacity: 1;
      transform: translateY(0);
    }
    .caption {
      position: absolute;
      bottom: 36px;
      left: 16px; right: 16px;
      text-align: center;
      color: #f0f0f0;
      font-size: 14px;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 1s;
      z-index: 20;
    }
    .caption.show { opacity: 1; }
    .tap-hint {
      position: absolute;
      bottom: 85px;
      left: 0; right: 0;
      text-align: center;
      color: rgba(255,255,255,0.65);
      font-size: 13px;
      z-index: 20;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    .music-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.35);
      border: none;
      color: white;
      font-size: 17px;
      z-index: 30;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .start-screen {
      position: absolute;
      inset: 0;
      background: #686a67;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.5s;
    }
    .start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .start-btn {
      background: #ff6b9d;
      color: white;
      border: none;
      padding: 15px 34px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255,107,157,0.4);
      transition: transform 0.15s;
    }
    .start-btn:active { transform: scale(0.96); }
    .start-title {
      color: white;
      font-size: 20px;
      margin-bottom: 22px;
      text-align: center;
      padding: 0 20px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="start-screen" id="startScreen">
      <div class="start-title">🐱 for you</div>
      <button class="start-btn" id="startBtn">Tap to open</button>
    </div>

    <div class="scene" id="scene1">
      <img src="girl.png" alt="girl">
      <div class="text">I love cats!</div>
    </div>

    <div class="scene" id="scene2">
      <img src="guy.png" alt="guy">
      <div class="text">Me too...</div>
    </div>

    <div class="scene" id="scene3">
      <img src="both.png" alt="both">
    </div>

    <div class="tap-hint" id="hint" style="display:none">tap anywhere</div>
    <div class="caption" id="caption">Send this to your crush if you're brave enough...</div>

    <button class="music-btn" id="musicBtn">🔊</button>
  </div>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    const scenes = [
      document.getElementById('scene1'),
      document.getElementById('scene2'),
      document.getElementById('scene3')
    ];
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const hint = document.getElementById('hint');
    const caption = document.getElementById('caption');
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');

    let current = -1;
    let musicOn = true;

    function showScene(index) {
      scenes.forEach((s, i) => s.classList.toggle('active', i === index));
      current = index;

      if (index === 2) {
        hint.style.display = 'none';
        setTimeout(() => caption.classList.add('show'), 700);
      } else {
        hint.style.display = 'block';
        caption.classList.remove('show');
      }
    }

    function next() {
      if (current < 2) showScene(current + 1);
    }

    startBtn.addEventListener('click', () => {
      startScreen.classList.add('hidden');
      musicBtn.style.display = 'flex';
      music.volume = 0.42;
      music.play().catch(() => {});
      showScene(0);
    });

    document.querySelector('.stage').addEventListener('click', (e) => {
      if (e.target.closest('#startScreen') || e.target.closest('.music-btn')) return;
      if (current >= 0 && current < 2) next();
    });

    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      musicOn = !musicOn;
      if (musicOn) {
        music.play();
        musicBtn.textContent = '🔊';
      } else {
        music.pause();
        musicBtn.textContent = '🔇';
      }
    });

    // Preload images
    ['girl.png', 'guy.png', 'both.png'].forEach(src => {
      const img = new Image();
      img.src = src;
    });
  </script>
</body>
</html>
